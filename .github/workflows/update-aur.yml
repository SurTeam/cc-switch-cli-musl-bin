name: Update AUR package

on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: cc-switch-cli-musl-bin-update
  cancel-in-progress: false

env:
  AUR_PKGBASE: cc-switch-cli-musl-bin
  UPSTREAM_REPO: SaladDay/cc-switch-cli

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out packaging repository
        uses: actions/checkout@v4

      - name: Update and build in Arch Linux
        id: update
        run: |
          set -Eeuo pipefail
          docker run --rm \
            --env UPSTREAM_REPO \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            archlinux:base-devel \
            bash -Eeuo pipefail -c '
              pacman -Syu --noconfirm --needed curl jq git openssh ca-certificates

              host_uid=$(stat -c %u /workspace)
              host_gid=$(stat -c %g /workspace)
              getent group "$host_gid" >/dev/null || groupadd --gid "$host_gid" hostgroup
              useradd --uid "$host_uid" --gid "$host_gid" --create-home builder 2>/dev/null || true

              work=/tmp/aur-package
              rm -rf "$work"
              mkdir -p "$work"
              cp /workspace/PKGBUILD /workspace/.SRCINFO /workspace/upstream-LICENSE "$work/"
              chown -R "$host_uid:$host_gid" "$work"
              runuser -u builder -- env HOME=/home/builder UPSTREAM_REPO="$UPSTREAM_REPO" \
                bash /workspace/.github/scripts/update-package.sh "$work"

              cp "$work/PKGBUILD" "$work/.SRCINFO" /workspace/
            '

          if git diff --quiet -- PKGBUILD .SRCINFO; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git diff --check
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated package metadata
        if: steps.update.outputs.changed == 'true'
        run: |
          set -Eeuo pipefail
          git config user.name 'surtsingv'
          git config user.email '282812635+surtsingv@users.noreply.github.com'
          git add PKGBUILD .SRCINFO
          git commit -m "upgpkg: $(sed -n 's/^pkgver=//p' PKGBUILD)-1"
          git push origin HEAD:main

      - name: Synchronize AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${AUR_SSH_PRIVATE_KEY:-}" ]]; then
            echo '::warning::AUR_SSH_PRIVATE_KEY is not configured; AUR synchronization skipped.'
            exit 0
          fi

          eval "$(ssh-agent -s)"
          cleanup() {
            ssh-add -D >/dev/null 2>&1 || true
            ssh-agent -k >/dev/null 2>&1 || true
            unset AUR_SSH_PRIVATE_KEY
          }
          trap cleanup EXIT

          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -q -
          ssh_dir="$RUNNER_TEMP/aur-ssh"
          install -d -m 700 "$ssh_dir"
          aur_host_key=$(ssh-keyscan -T 10 -t ed25519 aur.archlinux.org 2>/dev/null)
          aur_host_fingerprint=$(printf '%s\n' "$aur_host_key" | ssh-keygen -lf - -E sha256 | awk '{print $2}')
          [[ "$aur_host_fingerprint" == 'SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4' ]] || {
            echo '::error::AUR host key fingerprint changed; refusing to connect.'
            exit 1
          }
          printf '%s\n' "$aur_host_key" > "$ssh_dir/known_hosts"
          chmod 644 "$ssh_dir/known_hosts"
          export GIT_SSH_COMMAND="ssh -oBatchMode=yes -oConnectTimeout=10 -oServerAliveInterval=10 -oServerAliveCountMax=2 -oStrictHostKeyChecking=yes -oUserKnownHostsFile=$ssh_dir/known_hosts"

          aur_dir="$RUNNER_TEMP/aur-package"
          clone_aur() {
            local attempt
            for attempt in 1 2; do
              rm -rf "$aur_dir"
              if timeout 60s git clone --depth=1 "ssh://aur@aur.archlinux.org/${AUR_PKGBASE}.git" "$aur_dir"; then
                return 0
              fi
              echo "::warning::AUR clone attempt ${attempt}/2 failed."
              [[ "$attempt" -lt 2 ]] || return 1
              sleep 15
            done
          }
          clone_aur

          cp PKGBUILD .SRCINFO upstream-LICENSE LICENSE "$aur_dir/"
          git -C "$aur_dir" config user.name 'surtsingv'
          git -C "$aur_dir" config user.email '282812635+surtsingv@users.noreply.github.com'
          git -C "$aur_dir" add PKGBUILD .SRCINFO upstream-LICENSE LICENSE

          if git -C "$aur_dir" diff --cached --quiet; then
            echo 'AUR package is already current.'
          else
            git -C "$aur_dir" commit -m "upgpkg: $(sed -n 's/^pkgver=//p' PKGBUILD)-1"
            for attempt in 1 2; do
              if timeout 60s git -C "$aur_dir" push origin HEAD:master; then
                break
              fi
              echo "::warning::AUR push attempt ${attempt}/2 failed."
              [[ "$attempt" -lt 2 ]] || exit 1
              sleep 15
            done
          fi
